<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Login - iBarangay</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <link rel="stylesheet" href="assets/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="assets/fonts/fontawesome-all.min.css">
    <style>
        body { background: #f5f5f5; }
        .card { margin-top: 60px; border-radius: 1rem; box-shadow: 0 2px 24px rgba(0,0,0,0.08);}
        .navbar { background: #C7B98E !important; }
        .btn, .btn-warning, .btn-success, .btn-info, .btn-secondary {
            background: #C7B98E !important;
            border-color: #C7B98E !important;
            color: #000 !important;
        }
        .btn-c7b98e {
            background: #C7B98E !important;
            border-color: #C7B98E !important;
            color: #000 !important;
        }
        .btn-c7b98e:active, .btn-c7b98e:focus, .btn-c7b98e:hover {
            background: #b2a67c !important;
            border-color: #b2a67c !important;
            color: #000 !important;
        }
        .form-control:focus {
            border-color: #C7B98E;
            box-shadow: 0 0 0 .2rem rgba(199,185,142,.25);
        }
        .logo {
            font-size: 2rem;
            color: #000;
            font-weight: bold;
            margin-bottom: .5rem;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light p-2">
        <a class="navbar-brand d-flex align-items-center" href="#">
            <span class="logo"><i class="fas fa-laugh-wink"></i> iBarangay</span>
        </a>
    </nav>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-sm-8 col-md-6 col-lg-4">
                <div class="card p-4">
                    <h4 class="mb-3 text-center">Login</h4>
                    <form id="loginForm" autocomplete="off">
                        <div class="mb-3">
                            <label class="form-label" for="loginUser">Username</label>
                            <input class="form-control" type="text" id="loginUser" required autocomplete="username">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="loginPass">Password</label>
                            <input class="form-control" type="password" id="loginPass" required autocomplete="current-password">
                        </div>
                        <button class="btn btn-c7b98e w-100" type="submit">Login</button>
                        <div id="loginError" class="text-danger mt-2" style="display:none;">Invalid login. Try again.</div>
                    </form>
                </div>
            </div>
        </div>
    </div>
<script src="assets/bootstrap/js/bootstrap.min.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async function(e){
    e.preventDefault();

    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;

    try {
        const response = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password }),
            credentials: 'include'
        });

        if (response.ok) {
            window.location.href = "index.html";
        } else {
            document.getElementById('loginError').style.display = 'block';
        }
    } catch (err) {
        document.getElementById('loginError').style.display = 'block';
    }
});
</script>
</body>
</html>
