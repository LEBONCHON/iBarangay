<script src="js/api.js"></script>
<script>
// Helper: format today's date as YYYY/MM/DD
function todaysDate() {
    const d = new Date();
    return d.getFullYear() + "/" + String(d.getMonth()+1).padStart(2,"0") + "/" + String(d.getDate()).padStart(2,"0");
}

// Fetch and update dashboard counts using backend API
async function updateDashboardCounts() {
    const token = localStorage.getItem('adminToken');
    if (!token) {
        window.location.href = 'admin-login.html';
        return;
    }

    const data = await getAllRequests(token);
    const orders = Array.isArray(data.requests) ? data.requests : [];

    const today = todaysDate();
    let dueToday = 0, completed = 0, pending = 0;
    for(const order of orders) {
        if(order.dateRequested === today) dueToday++;
        if(order.status === "Completed") completed++;
        if(order.status === "Pending") pending++;
    }
    document.getElementById('dueTodayCount').textContent = dueToday;
    document.getElementById('completedCount').textContent = completed;
    document.getElementById('pendingCount').textContent = pending;
    document.getElementById('pending-orders-badge').textContent = pending;

    // Alerts dropdown: show pending orders
    const pendingList = document.getElementById('pending-orders-list');
    if(pendingList) {
        if(pending === 0) {
            pendingList.innerHTML = "<div class='px-3 py-2'>No pending orders</div>";
        } else {
            pendingList.innerHTML = orders.filter(o=>o.status==="Pending").map(o =>
                `<div class='px-3 py-1'>#${o.orderNumber || o._id} - ${o.name || o.fullName || ''}</div>`
            ).join('');
        }
    }
}

// Render order analytics (per category) using backend API
async function renderOrderAnalytics() {
    const token = localStorage.getItem('adminToken');
    if (!token) return;
    const data = await getAllRequests(token);
    const orders = Array.isArray(data.requests) ? data.requests : [];

    // Count per category
    const catMap = {};
    for(const order of orders) {
        if(!catMap[order.category]) catMap[order.category] = 0;
        catMap[order.category]++;
    }
    let html = '';
    if(Object.keys(catMap).length === 0) {
        html = '<div class="col-12"><em>No order data available.</em></div>';
    } else {
        for(const [cat, count] of Object.entries(catMap)) {
            html += `
                <div class="col-md-4 mb-3">
                    <div class="card border-left-info shadow h-100 py-2">
                        <div class="card-body">
                            <div class="row no-gutters align-items-center">
                                <div class="col mr-2">
                                    <div class="text-xs font-weight-bold text-info text-uppercase mb-1">${cat}</div>
                                    <div class="h5 mb-0 font-weight-bold text-gray-800">${count} order(s)</div>
                                </div>
                                <div class="col-auto">
                                    <i class="fas fa-folder fa-2x text-gray-300"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }
    }
    document.getElementById('orderAnalytics').innerHTML = html;
}

// Complete request button
document.getElementById('completeRequestBtn').onclick = function(e) {
    e.preventDefault();
    window.location.href = "table.html";
};

// On load: fetch dashboard data
document.addEventListener('DOMContentLoaded', () => {
    updateDashboardCounts();
    renderOrderAnalytics();
});
</script>
