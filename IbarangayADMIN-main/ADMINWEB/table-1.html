<script src="assets/bootstrap/js/bootstrap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script>
const API_BASE = "http://localhost:3000/api/requests";

function getQueryParam(name) {
    return new URLSearchParams(window.location.search).get(name);
}

function safe(val) { return val || ""; }

function isImage(filename) {
    const ext = filename.split('.').pop().toLowerCase();
    return ['jpg', 'jpeg', 'png', 'gif', 'bmp', 'webp'].includes(ext);
}

let currentRequest = null;
let requestId = getQueryParam('id');

// Helper: prettify keys for labels
function prettifyKey(key) {
    // Remove res_ prefix
    if (key.startsWith('res_')) key = key.slice(4);
    // Insert spaces before uppercase letters and capitalize
    return key
        .replace(/([A-Z])/g, ' $1') // Add space before caps
        .replace(/^./, c => c.toUpperCase()) // Capitalize first letter
        .replace(/\bOf\b/g, 'Of')   // Keep "Of" lowercase (optional)
        .replace(/\s+/g, ' ')       // Clean up multiple spaces
        .trim();
}

async function fetchRequest(id) {
    try {
        const res = await axios.get(`${API_BASE}/${id}`, { withCredentials: true });
        return res.data;
    } catch (err) {
        console.error(err);
        return null;
    }
}

// Display all fields in a pretty way
function renderRequestDetails(order) {
    let html = '<table class="table table-bordered details-table">';
    for (const [key, value] of Object.entries(order)) {
        if (key === 'files' || key === '__v' || key === '_id') continue;
        if (typeof value === 'object' && value !== null) continue;
        html += `<tr><th>${prettifyKey(key)}</th><td>${safe(value)}</td></tr>`;
    }
    html += '</table>';
    document.getElementById('request-details').innerHTML = html;
    document.getElementById('docTypeLabel').innerText = `Order Info (${safe(order.documentType)})`;
}

// Show all uploaded files (images as preview, others as download)
function renderFiles(filesObj) {
    if (!filesObj || Object.keys(filesObj).length === 0) {
        document.getElementById('uploaded-files').innerHTML = "<em>No files uploaded.</em>";
        return;
    }
    let html = '';
    for (const [field, file] of Object.entries(filesObj)) {
        if (!file || !file.filename) continue;
        const fileUrl = `http://localhost:3000/uploads/${file.filename}`;
        html += `<div class="mb-2"><strong>${prettifyKey(field)}:</strong> `;
        if (isImage(file.filename)) {
            html += `<br><img src="${fileUrl}" class="request-image" alt="${file.originalname}" /><br>`;
        }
        html += `<a href="${fileUrl}" target="_blank">${file.originalname}</a> (${file.mimetype}, ${Math.round(file.size/1024)} KB)</div>`;
    }
    document.getElementById('uploaded-files').innerHTML = html;
}

async function updateStatus(event) {
    event.preventDefault();
    const status = document.getElementById('statusSelect').value;
    document.getElementById('statusMsg').innerText = "Updating...";
    try {
        await axios.patch(`${API_BASE}/${requestId}/status`, { status }, { withCredentials: true });
        document.getElementById('statusMsg').innerText = "Status updated!";
        currentRequest.status = status;
    } catch (e) {
        document.getElementById('statusMsg').innerText = "Error updating status!";
    }
}

async function uploadFile(event) {
    event.preventDefault();
    const fileInput = document.getElementById('newFile');
    if (!fileInput.files.length) return;
    const formData = new FormData();
    formData.append('file', fileInput.files[0]);
    try {
        await axios.post(`${API_BASE}/${requestId}/upload`, formData, {
            withCredentials: true,
            headers: { 'Content-Type': 'multipart/form-data' }
        });
        loadRequest();
        fileInput.value = "";
    } catch (e) {
        alert("File upload failed.");
    }
}

async function loadRequest() {
    if (!requestId) { document.body.innerHTML = "<h2>Request ID missing from URL.</h2>"; return; }
    const order = await fetchRequest(requestId);
    if (!order) { document.body.innerHTML = "<h2>Request not found.</h2>"; return; }
    currentRequest = order;
    renderRequestDetails(order);
    renderFiles(order.files);
    document.getElementById('statusSelect').value = order.status || "cart";
}

document.getElementById('uploadForm').onsubmit = uploadFile;
document.getElementById('statusForm').onsubmit = updateStatus;
window.addEventListener("DOMContentLoaded", loadRequest);
</script>
