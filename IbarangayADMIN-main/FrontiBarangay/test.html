<!DOCTYPE html>
<html>
<head>
  <title>API Connection Test</title>
  <style>
    #result { white-space: pre-wrap; background: #f0f0f0; padding: 10px; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>API Connection Test</h1>
  <button id="test-basic">Test Basic API</button>
  <button id="test-register">Test Registration</button>
  <div id="result">Results will appear here</div>

  <script>
    document.getElementById('test-basic').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Testing basic connection...';
      
      try {
        // Test the basic endpoint
        const response = await fetch('http://localhost:3000/');
        const text = await response.text();
        resultDiv.textContent = 'Basic endpoint response:\n' + text;
      } catch (error) {
        resultDiv.textContent = 'Connection error: ' + error.message;
      }
    });

    document.getElementById('test-register').addEventListener('click', async () => {
      const resultDiv = document.getElementById('result');
      resultDiv.textContent = 'Testing registration...';
      
      try {
        // Test registration endpoint
        const response = await fetch('http://localhost:3000/api/users/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            email: 'test' + Date.now() + '@example.com',
            password: 'password123'
          })
        });
        
        // Get the response as text first
        const text = await response.text();
        resultDiv.textContent = 'Registration response as text:\n' + text;
        
        // Then try to parse as JSON
        try {
          const data = JSON.parse(text);
          resultDiv.textContent += '\n\nParsed as JSON:\n' + JSON.stringify(data, null, 2);
        } catch (jsonError) {
          resultDiv.textContent += '\n\nNot valid JSON: ' + jsonError.message;
        }
      } catch (error) {
        resultDiv.textContent = 'Connection error: ' + error.message;
      }
    });
  </script>
</body>
</html>
