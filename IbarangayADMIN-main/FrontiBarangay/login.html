<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iBarangay - Login/Register</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .auth-container {
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            padding: 30px;
        }
        
        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }
        
        .auth-header h1 {
            color: #1a73e8;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .auth-header img {
            width: 80px;
            height: auto;
            margin-bottom: 15px;
        }
        
        .auth-form {
            display: flex;
            flex-direction: column;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: #444;
        }
        
        .form-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            border-color: #1a73e8;
            outline: none;
        }
        
        .submit-btn {
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 14px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .submit-btn:hover {
            background-color: #0d5bcd;
        }
        
        .submit-btn:disabled {
            background-color: #a8c7fa;
            cursor: not-allowed;
        }
        
        .error-message {
            color: #d93025;
            font-size: 14px;
            margin-top: 10px;
            margin-bottom: 10px;
            min-height: 20px;
        }
        
        .switch-form {
            text-align: center;
            margin-top: 20px;
            color: #444;
        }
        
        .switch-form a {
            color: #1a73e8;
            text-decoration: none;
            cursor: pointer;
        }
        
        .switch-form a:hover {
            text-decoration: underline;
        }

        .debug-info {
            margin-top: 20px;
            padding: 10px;
            background-color: #f8f9fa;
            border-radius: 4px;
            font-size: 12px;
            color: #6c757d;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <img src="logo.png" alt="iBarangay Logo" id="logo">
            <h1 id="form-title">Login</h1>
        </div>
        
        <form class="auth-form" id="auth-form">
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>
            
            <div class="error-message" id="error-message"></div>
            
            <button type="submit" class="submit-btn" id="submit-btn">Login</button>
        </form>
        
        <div class="switch-form">
            <span id="switch-form-text">Don't have an account? <a id="switch-form-link">Sign up here</a></span>
        </div>

        <div class="debug-info" id="debug-info"></div>
    </div>

    <script>
        // API connection for iBarangay
        const API_URL = 'http://localhost:3000/api';

        // Show debug info
        function updateDebugInfo() {
            const now = new Date();
            const year = now.getUTCFullYear();
            const month = String(now.getUTCMonth() + 1).padStart(2, '0');
            const day = String(now.getUTCDate()).padStart(2, '0');
            const hours = String(now.getUTCHours()).padStart(2, '0');
            const minutes = String(now.getUTCMinutes()).padStart(2, '0');
            const seconds = String(now.getUTCSeconds()).padStart(2, '0');
            
            const formattedDate = `${year}-${month}-${day} ${hours}:${minutes}:${seconds}`;
            
            const debugElement = document.getElementById('debug-info');
            debugElement.innerHTML = `
                Current Date and Time (UTC - YYYY-MM-DD HH:MM:SS formatted): ${formattedDate}<br>
                Current User's Login: LEBONCHON
            `;
        }
        
        // Update debug info every second
        setInterval(updateDebugInfo, 1000);
        updateDebugInfo();

        // Register new user
        async function registerUser(userData) {
            try {
                console.log('Sending registration data:', userData);
                
                const response = await fetch(`${API_URL}/users/register`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(userData)
                });
                
                const data = await response.json();
                console.log('Registration response:', data);
                return data;
            } catch (error) {
                console.error('Registration error:', error);
                return { success: false, message: 'Network error during registration' };
            }
        }

        // Login user
        async function loginUser(credentials) {
            try {
                console.log('Sending login data:', credentials);
                
                const response = await fetch(`${API_URL}/users/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(credentials)
                });
                
                const data = await response.json();
                console.log('Login response:', data);
                
                if (data.success) {
                    // Store auth data in localStorage
                    localStorage.setItem('user', JSON.stringify(data.user));
                    localStorage.setItem('token', data.token);
                }
                
                return data;
            } catch (error) {
                console.error('Login error:', error);
                return { success: false, message: 'Network error during login' };
            }
        }

        // DOM elements
        const authForm = document.getElementById('auth-form');
        const formTitle = document.getElementById('form-title');
        const submitBtn = document.getElementById('submit-btn');
        const switchFormText = document.getElementById('switch-form-text');
        const switchFormLink = document.getElementById('switch-form-link');
        const errorMsg = document.getElementById('error-message');
        
        // Toggle between login and signup forms
        let isLogin = true;
        
        switchFormLink.addEventListener('click', () => {
            isLogin = !isLogin;
            
            if (isLogin) {
                formTitle.textContent = 'Login';
                submitBtn.textContent = 'Login';
                switchFormText.textContent = "Don't have an account? ";
                switchFormLink.textContent = "Sign up here";
            } else {
                formTitle.textContent = 'Create Account';
                submitBtn.textContent = 'Sign Up';
                switchFormText.textContent = "Already have an account? ";
                switchFormLink.textContent = "Login here";
            }
            
            errorMsg.textContent = '';
        });
        
        // Form submission
        authForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            errorMsg.textContent = '';

            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                errorMsg.textContent = 'Please fill out all fields.';
                return;
            }

            // Show loading state
            const originalButtonText = submitBtn.textContent;
            submitBtn.textContent = isLogin ? 'Logging in...' : 'Signing up...';
            submitBtn.disabled = true;

            try {
                if (isLogin) {
                    // Login user - using email as username
                    const result = await loginUser({ 
                        username: email, 
                        password: password
                    });
                    
                    if (result.success) {
                        window.location.href = 'index.html';
                    } else {
                        errorMsg.textContent = result.message || 'Invalid login credentials.';
                    }
                } else {
                    // Register user - make sure to include username field!
                    const result = await registerUser({
                        username: email,  // This is the key field that was missing
                        email: email,
                        password: password,
                        firstName: email.split('@')[0],
                        lastName: ''
                    });
                    
                    if (result.success) {
                        // Auto-login after successful registration
                        const loginResult = await loginUser({ 
                            username: email, 
                            password: password
                        });
                        
                        if (loginResult.success) {
                            window.location.href = 'index.html';
                        } else {
                            errorMsg.textContent = 'Registration successful. Please log in.';
                            isLogin = true;
                            formTitle.textContent = 'Login';
                            submitBtn.textContent = 'Login';
                            switchFormText.textContent = "Don't have an account? ";
                            switchFormLink.textContent = "Sign up here";
                        }
                    } else {
                        errorMsg.textContent = result.message || 'Registration failed. Please try again.';
                    }
                }
            } catch (error) {
                errorMsg.textContent = 'An error occurred. Please try again.';
                console.error(error);
            }

            // Reset button
            submitBtn.textContent = originalButtonText;
            submitBtn.disabled = false;
        });

        // Check if user is already logged in
        document.addEventListener('DOMContentLoaded', () => {
            if (localStorage.getItem('user') && localStorage.getItem('token')) {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
