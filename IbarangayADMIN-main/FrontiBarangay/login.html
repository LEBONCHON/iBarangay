<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login / Sign Up</title>
  <style>
    * { box-sizing: border-box; }
    body, html {
      margin: 0; padding: 0; height: 100vh;
      font-family: Arial, sans-serif;
      background-image: url('https://i0.wp.com/carlocarrasco.com/wp-content/uploads/2022/01/pquecover.jpg?fit=1200%2C679&ssl=1');
      background-size: cover;
      background-position: center;
      overflow: hidden;
    }
    .overlay {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5); z-index: 10;
    }
    .login-container {
      position: fixed; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.9);
      padding: 30px 40px; border-radius: 10px;
      width: 360px; text-align: center; z-index: 20;
      box-shadow: 0 0 20px rgba(0,0,0,0.3); color: #6D2525;
    }
    .login-container h2 { margin-bottom: 20px; }
    .login-container input {
      width: 100%; padding: 10px; margin: 10px 0;
      font-size: 16px; border: 1px solid #aaa;
      border-radius: 5px;
    }
    .login-container button {
      width: 100%; padding: 12px;
      background-color: #6D2525; border: none;
      color: white; font-size: 16px;
      cursor: pointer; border-radius: 5px;
      margin-top: 10px;
    }
    .login-container button:hover { background-color: #3c1515; }
    .switch-form {
      margin-top: 15px; font-size: 14px;
      cursor: pointer; color: #6D2525;
      text-decoration: underline;
    }
    .error {
      color: red; margin: 10px 0;
    }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="overlay"></div>

  <div class="login-container">
    <h2 id="form-title">Login</h2>
    <form id="auth-form">
      <input type="text" id="username" class="hidden" placeholder="Username" />
      <input type="text" id="firstName" class="hidden" placeholder="First Name" />
      <input type="text" id="lastName" class="hidden" placeholder="Last Name" />
      <input type="text" id="email" placeholder="Email" required />
      <input type="password" id="password" placeholder="Password" required minlength="6" />
      <button type="submit" id="submit-btn">Login</button>
    </form>
    <p class="error" id="error-msg"></p>
    <p class="switch-form" id="switch-form">Don't have an account? Sign up here</p>
  </div>

  <script>
    const formTitle = document.getElementById('form-title');
    const authForm = document.getElementById('auth-form');
    const switchFormText = document.getElementById('switch-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    const usernameInput = document.getElementById('username');
    const firstNameInput = document.getElementById('firstName');
    const lastNameInput = document.getElementById('lastName');

    let isLogin = true;

    function toggleFormFields() {
      usernameInput.classList.toggle('hidden', isLogin);
      firstNameInput.classList.toggle('hidden', isLogin);
      lastNameInput.classList.toggle('hidden', isLogin);
    }

    switchFormText.addEventListener('click', () => {
      isLogin = !isLogin;
      if (isLogin) {
        formTitle.textContent = 'Login';
        submitBtn.textContent = 'Login';
        switchFormText.textContent = "Don't have an account? Sign up here";
      } else {
        formTitle.textContent = 'Sign Up';
        submitBtn.textContent = 'Sign Up';
        switchFormText.textContent = "Already have an account? Login here";
      }
      toggleFormFields();
      errorMsg.textContent = '';
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';

      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value;

      const payload = { email, password };

      if (!isLogin) {
        payload.username = usernameInput.value.trim();
        payload.firstName = firstNameInput.value.trim();
        payload.lastName = lastNameInput.value.trim();
      }

      const endpoint = isLogin ? '/api/users/login' : '/api/users/register';
      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        const data = await res.json();

        if (!res.ok) {
          errorMsg.textContent = data.message || 'Something went wrong.';
          return;
        }

        // ✅ Store token and user info after successful login/register
        if (data.token) {
          localStorage.setItem('token', data.token);
        }
        if (data.user) {
          localStorage.setItem('user', JSON.stringify(data.user));
        }

        window.location.href = 'index.html';

      } catch (err) {
        console.error('Fetch error:', err);
        errorMsg.textContent = 'Server error. Please try again later.';
      }
    });

    // Initialize field visibility
    toggleFormFields();
  </script>
</body>
</html>
