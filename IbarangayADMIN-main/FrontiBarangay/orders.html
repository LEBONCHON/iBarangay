<script>
async function loadOrders() {
  const orderList = document.getElementById('order-list');
  orderList.innerHTML = '';
  const token = localStorage.getItem('token');
  if (!token) {
    orderList.innerHTML = '<div>Please log in to view your orders.</div>';
    document.querySelector('.subtotal').textContent = 'SUBTOTAL: ₱0.00';
    return;
  }

  try {
    const res = await fetch('/api/requests/mine', {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (!res.ok) {
      orderList.innerHTML = '<div>Not authorized or failed to fetch orders.</div>';
      document.querySelector('.subtotal').textContent = 'SUBTOTAL: ₱0.00';
      return;
    }
    let orders = await res.json();
    // Only show requests in "cart" status (NOT pending, completed, etc.)
    orders = orders.filter(order => order.status === "cart");
    if (!orders || orders.length === 0) {
      orderList.innerHTML = '<div>No orders yet.</div>';
      document.querySelector('.subtotal').textContent = 'SUBTOTAL: ₱0.00';
      return;
    }

    // Price mapping per document type
    const priceMap = {
      "Certificate of Residency": 100,
      "Barangay ID": 120
    };

    let subtotal = 0;

    orders.forEach((order) => {
      const docType = order.documentType || "Unknown Document";
      const qty = 1;
      const price = priceMap[docType] || 0;
      const total = price * qty;
      subtotal += total;

      const orderEl = document.createElement('div');
      orderEl.className = 'order-item';
      orderEl.innerHTML = `
        <div class="order-info">
          <img src="https://img.icons8.com/ios/50/document--v1.png" alt="doc" />
          <div class="order-name">${docType}</div>
        </div>
        <div class="order-price">₱${price}</div>
        <div class="order-total">₱${total}</div>
      `;
      orderList.appendChild(orderEl);
    });

    document.querySelector('.subtotal').textContent = 'SUBTOTAL: ₱' + subtotal.toFixed(2);

  } catch (err) {
    orderList.innerHTML = '<div>Failed to load orders.</div>';
    document.querySelector('.subtotal').textContent = 'SUBTOTAL: ₱0.00';
  }
}

window.onload = loadOrders;

// Proceed button - call backend to "checkout" cart orders, then go to status page
document.querySelector('.proceed-btn').addEventListener('click', async function() {
  const token = localStorage.getItem('token');
  if (!token) {
    window.location.href = 'status.html';
    return;
  }
  // Call backend to move "cart" requests to "pending"
  await fetch('/api/requests/checkout', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + token }
  });
  window.location.href = 'status.html';
});
</script>

</body>
